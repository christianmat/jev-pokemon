<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Plays Pokémon</title>
<style>
  :root {
    --bg: #f4f4ef; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e2e2dc;
    --accent: #2f6f4f; --bar: #cfe3d6; --warn: #b4462f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --panel: #1f1f1d; --ink: #ecece6; --muted: #9a9a92; --line: #33332f; --accent: #7cc49b; --bar: #2c4a39; --warn: #e38a73; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 16px 6px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .pill { font-size: 12px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(320px, 480px) 1fr; gap: 16px; padding: 8px 16px 16px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  canvas { width: 100%; image-rendering: pixelated; border-radius: 6px; background: #000; display: block; aspect-ratio: 160/144; }
  .row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  button { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; }
  button:hover { border-color: var(--accent); }
  .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 4px; }
  .goal { font-size: 15px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--muted); }
  .party { display: grid; gap: 6px; margin-top: 6px; }
  .mon { display: grid; grid-template-columns: 1fr 90px 60px; gap: 8px; align-items: center; font-variant-numeric: tabular-nums; }
  .hp { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .hp i { display: block; height: 100%; background: var(--accent); }
  .side { display: grid; gap: 16px; align-content: start; min-width: 0; }
  #feed { max-height: 62vh; overflow-y: auto; display: grid; gap: 8px; }
  .dec { border-top: 1px solid var(--line); padding-top: 8px; }
  .dec:first-child { border-top: 0; padding-top: 0; }
  .dec .head { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .dec .pick { font-weight: 600; margin: 2px 0 4px; overflow-wrap: anywhere; }
  .opt { display: grid; grid-template-columns: 1fr 44px; gap: 6px; font-size: 12px; align-items: center; }
  .opt .bar { position: relative; height: 16px; border-radius: 3px; overflow: hidden; }
  .opt .bar i { position: absolute; inset: 0 auto 0 0; background: var(--bar); }
  .opt .bar span { position: relative; padding-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; line-height: 16px; }
  .opt.on .bar span { font-weight: 600; }
  .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ev { font-size: 12px; color: var(--muted); }
  .ev.milestone { color: var(--accent); font-weight: 600; }
  .ev.error { color: var(--warn); }
</style>
</head>
<body>
<header>
  <h1>Jev Plays Pokémon Red</h1>
  <span class="pill" id="backend">connecting…</span>
  <span class="pill" id="throttle"></span>
</header>
<main>
  <section>
    <div class="card">
      <canvas id="screen" width="160" height="144"></canvas>
      <div class="row">
        <button id="pause">Pause / resume</button>
        <button id="save">Save state</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="calls">0</b><span>Jev calls</span></div>
        <div class="stat"><b id="cache">0</b><span>cache hits</span></div>
        <div class="stat"><b id="tokens">0</b><span>input tokens</span></div>
        <div class="stat"><b id="badges">0</b><span>badges</span></div>
      </div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="label">Objective <span id="mprog"></span></div>
      <div class="goal" id="goal">—</div>
      <div class="label" style="margin-top:10px">Location</div>
      <div id="loc">—</div>
      <div class="label" style="margin-top:10px">Party</div>
      <div class="party" id="party"></div>
    </div>
  </section>
  <section class="side">
    <div class="card">
      <div class="label">Jev decisions (latest first)</div>
      <div id="feed"></div>
    </div>
    <div class="card">
      <div class="label">Events</div>
      <div id="events" style="max-height: 24vh; overflow-y: auto"></div>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const ctx = $('screen').getContext('2d');
const img = ctx.createImageData(160, 144);
let ws;
function connect() {
  ws = new WebSocket(`ws://${location.host}`);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = (m) => {
    if (m.data instanceof ArrayBuffer) {
      const px = new Uint8Array(m.data);
      img.data.set(px.subarray(0, img.data.length));
      for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
      ctx.putImageData(img, 0, 0);
      return;
    }
    const msg = JSON.parse(m.data);
    if (msg.type === 'status') status(msg);
    else if (msg.type === 'jev') decision(msg);
    else if (msg.type === 'event') event(msg.e);
    else if (msg.type === 'history') msg.events.forEach(event);
  };
  ws.onclose = () => setTimeout(connect, 1000);
}
function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function status(s) {
  $('backend').textContent = `Jev backend: ${s.jev.backend}`;
  $('throttle').textContent = `throttle ≥${s.jev.minIntervalMs}ms · ≤${s.jev.maxPerMinute}/min`;
  $('calls').textContent = s.jev.calls; $('cache').textContent = s.jev.cacheHits;
  $('tokens').textContent = s.jev.inputTokens.toLocaleString(); $('badges').textContent = s.badges;
  $('goal').textContent = s.milestone.goal ?? 'Game complete!';
  $('mprog').textContent = `(${s.milestone.index}/${s.milestone.total})`;
  $('loc').textContent = `${s.map} (${s.x}, ${s.y}) · ¥${s.money}`;
  $('party').innerHTML = s.party.map((p) => `<div class="mon"><div>${esc(p.name)} <span class="num">Lv${p.level}</span></div>
    <div class="hp"><i style="width:${Math.round(100 * p.hp / Math.max(1, p.maxHp))}%"></i></div><div class="num">${p.hp}/${p.maxHp}</div></div>`).join('') || '<span class="ev">none yet</span>';
}
function decision({ r, stats }) {
  $('calls').textContent = stats.calls; $('cache').textContent = stats.cacheHits; $('tokens').textContent = stats.inputTokens.toLocaleString();
  const a = Object.values(r.answers)[0];
  const picked = Object.values(r.picked)[0];
  const probs = a && a.probabilities ? Object.entries(a.probabilities).sort((x, y) => y[1] - x[1]).slice(0, 5) : [];
  const el = document.createElement('div');
  el.className = 'dec';
  el.innerHTML = `<div class="head"><span>#${r.n} · ${esc(r.purpose)}</span><span>${r.cached ? 'cached' : r.latencyMs + 'ms'}</span></div>
    <div class="pick">${esc(picked)}</div>` + probs.map(([k, p]) => `<div class="opt ${k === picked ? 'on' : ''}"><div class="bar"><i style="width:${(p * 100).toFixed(1)}%"></i><span>${esc(k)}</span></div><div class="num">${(p * 100).toFixed(0)}%</div></div>`).join('');
  $('feed').prepend(el);
  while ($('feed').children.length > 60) $('feed').lastChild.remove();
}
function event(e) {
  if (e.kind === 'decision') return;
  const el = document.createElement('div');
  el.className = `ev ${e.kind}`;
  el.textContent = `[${e.kind}] ${e.msg}`;
  $('events').prepend(el);
  while ($('events').children.length > 120) $('events').lastChild.remove();
}
$('pause').onclick = () => ws.send(JSON.stringify({ cmd: 'pause' }));
$('save').onclick = () => ws.send(JSON.stringify({ cmd: 'save' }));
connect();
</script>
</body>
</html>
